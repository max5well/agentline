# XcodeGen project definition — run `xcodegen generate` in this directory
# once Xcode is installed, then open Agentline.xcodeproj.
name: Agentline
options:
  bundleIdPrefix: dev.max5well
  deploymentTarget:
    iOS: "18.0"
packages:
  WebRTC:
    url: https://github.com/stasel/WebRTC
    from: "120.0.0"
targets:
  Agentline:
    type: application
    platform: iOS
    sources: [Agentline]
    # Sign in with Apple needs a paid Apple Developer team; the free
    # Personal Team (BF275FGFBQ) rejects the entitlement. Re-enable when
    # Max joins the program — until then the Apple button errors at tap.
    # entitlements:
    #   path: Agentline/Agentline.entitlements
    #   properties:
    #     com.apple.developer.applesignin: [Default]
    settings:
      base:
        DEVELOPMENT_TEAM: BF275FGFBQ
    dependencies:
      - package: WebRTC
  AgentlineUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [AgentlineUITests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Agentline
schemes:
  Agentline:
    build:
      targets:
        Agentline: all
    run:
      config: Debug
    test:
      config: Debug
      targets: [AgentlineUITests]
    info:
      path: Agentline/Info.plist
      properties:
        CFBundleDisplayName: agentline
        UILaunchScreen: {}
        UIBackgroundModes: [audio, voip]
        NSMicrophoneUsageDescription: agentline needs the microphone for voice calls with your agents.
        # Google SSO returns the Supabase session via this scheme (ADR-6).
        CFBundleURLTypes:
          - CFBundleURLSchemes: [agentline]
    settings:
      base:
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
