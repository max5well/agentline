# XcodeGen project definition — run `xcodegen generate` in this directory
# once Xcode is installed, then open Agentline.xcodeproj.
name: Agentline
options:
  bundleIdPrefix: dev.max5well
  deploymentTarget:
    iOS: "18.0"
packages:
  WebRTC:
    url: https://github.com/stasel/WebRTC
    from: "120.0.0"
  PostHog:
    url: https://github.com/PostHog/posthog-ios
    from: "3.0.0"
targets:
  Agentline:
    type: application
    platform: iOS
    sources: [Agentline]
    # Sign in with Apple and Push Notifications need a paid Apple Developer
    # team; the free Personal Team rejects these entitlements. Re-enable the
    # file when Max joins the program and turns on both App ID capabilities.
    # entitlements:
    #   path: Agentline/Agentline.entitlements
    info:
      path: Agentline/Info.plist
      properties:
        CFBundleDisplayName: agentline
        # Set true only together with the Sign in with Apple entitlement on a paid Developer team.
        AgentlineAppleSignInEnabled: false
        # PostHog is enabled when a phc_ project key is provided here or via the Xcode scheme.
        PostHogAPIKey: ""
        PostHogHost: https://eu.i.posthog.com
        # Enable only after adding the Push Notifications capability to the
        # paid Apple team and configuring APNs on the backend.
        AgentlineVoIPPushEnabled: false
        UILaunchScreen: {}
        UIBackgroundModes: [audio, voip]
        NSMicrophoneUsageDescription: agentline needs the microphone for voice calls with your agents.
        NSCameraUsageDescription: agentline uses the camera to take agent avatar photos.
        NSRemindersFullAccessUsageDescription: agentline adds action items to Reminders only when you ask.
        NSCalendarsFullAccessUsageDescription: agentline creates calendar drafts from action items only when you ask.
        NSSupportsLiveActivities: true
        # Google SSO returns the Supabase session via this scheme (ADR-6).
        CFBundleURLTypes:
          - CFBundleURLSchemes: [agentline]
        LSApplicationQueriesSchemes: [obsidian]
    settings:
      base:
        DEVELOPMENT_TEAM: BF275FGFBQ
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
      configs:
        Debug:
          APNS_ENVIRONMENT: development
        Release:
          APNS_ENVIRONMENT: production
    dependencies:
      - package: WebRTC
      - package: PostHog
      - target: AgentlineWidgets
        embed: true
  AgentlineWidgets:
    type: app-extension
    platform: iOS
    sources:
      - AgentlineWidgets
      - Agentline/CallActivityAttributes.swift
    info:
      path: AgentlineWidgets/Info.plist
      properties:
        CFBundleDisplayName: agentline
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.max5well.Agentline.Widgets
        DEVELOPMENT_TEAM: BF275FGFBQ
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "5.10"
  AgentlineUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [AgentlineUITests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Agentline
schemes:
  Agentline:
    build:
      targets:
        Agentline: all
    run:
      config: Debug
      # Local IAP testing without App Store Connect (free Apple team).
      storeKitConfiguration: Agentline/Agentline.storekit
    test:
      config: Debug
      targets: [AgentlineUITests]
